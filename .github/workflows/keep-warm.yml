name: Keep API warm

# Render's free plan puts the API to sleep after ~15 min without traffic, and
# waking it takes ~50s. Pinging /api/health every 10 min keeps it (and the
# Atlas connection) awake so visitors never hit a cold start.
# Setup: GitHub repo → Settings → Secrets and variables → Actions → Variables
# → New variable  API_URL = https://<your-render-service>.onrender.com

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.API_URL != '' }}
    steps:
      - name: Ping health endpoint
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 "${{ vars.API_URL }}/api/health"
