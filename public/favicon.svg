<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b463b"/>
      <stop offset="100%" stop-color="#05261f"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f3843f"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#f59e0b" stroke-opacity="0.35" stroke-width="1.5"/>
  <ellipse cx="32" cy="14" rx="22" ry="8" fill="#ffffff" fill-opacity="0.08"/>

  <!-- "h" Left Stem -->
  <path d="M18 16V46" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
  <!-- "h" Arch that flows into "S" Wave -->
  <path d="M18 31C18 24.5 24.5 23 29 25.5C33.5 28 34 32.5 39 34.5C44 36.5 47 34 47 30" stroke="url(#sparkGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- "S" Bottom Sweep -->
  <path d="M30 33C30 40 34 45.5 41 45.5C45.5 45.5 47.5 43 47.5 40" stroke="url(#sparkGrad)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- High-Energy Radiant 4-point Sparkle Star -->
  <path d="M48 13C48 16.5 45.5 19 42 19C45.5 19 48 21.5 48 25C48 21.5 50.5 19 54 19C50.5 19 48 16.5 48 13Z" fill="#fbbf24" filter="url(#glow)"/>
</svg>
